[project]
name = "federated-ddos-research"
version = "0.1.0"
description = "Development-data audits, bounded federated training checks, and formal research records"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{name = "Hossein Oliabak"}]
dependencies = [
  "numpy==2.4.4",
  "pandas==3.0.3",
  "pyarrow==25.0.1",
  "scikit-learn==1.9.0",
  "torch==2.13.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]

[tool.ruff]
target-version = "py313"
line-length = 100
