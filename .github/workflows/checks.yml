name: Research code checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.3"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python scripts/engineering_pilot.py --self-test
      - run: uv run python scripts/check_demo.py
